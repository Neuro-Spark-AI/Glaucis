# K-tiled Pallas matmul from Neuro-Spark-AI/HW_Optimization, on a v6e-16 over SSH.
# First real-kernel test of the pallas-evolve loop.

kernel:
  name: "matmul_pallas"
  template: "kernels/matmul_pallas.py"
  reference: "kernels/matmul_pallas_ref.py"
  evolve_markers:
    start: "# EVOLVE-BLOCK-START"
    end: "# EVOLVE-BLOCK-END"

shapes:
  - { M: 512, N: 512, K: 512 }
  - { M: 1024, N: 1024, K: 1024 }
  - { M: 2048, N: 2048, K: 2048 }

correctness:
  method: "allclose"
  rtol: 1e-2
  atol: 1.0

evaluator:
  type: "ssh"
  # v6e-16 = 4 hosts on one ICI domain; co-launched together, results from the
  # first (primary). IPs go stale on stop/start — re-discover with:
  #   gcloud compute tpus tpu-vm describe wan22-v6e16-flex-useast5-20260716 \
  #     --zone us-east5-a --format="value(networkEndpoints[].accessConfig.externalIp)"
  ssh_hosts:
    - "34.162.213.160"   # jax process 0 (primary)
    - "34.162.156.81"
    - "34.162.168.23"
    - "34.153.23.85"
  ssh_user: "cloud-user"
  ssh_key: "/home/shuyang/.ssh/neurospark_cloud-user.sshkey"
  ssh_remote_repo: "/home/cloud-user/Glaucis"
  ssh_python: "/home/cloud-user/tpu-venv/bin/python"
  ssh_remote_tmp: "/tmp/kernel_eval"
  ssh_artifacts_dir: "/tmp/kernel_eval_artifacts"
  timeout: 1800

roofline:                     # TPU v6e (Trillium), physical VMEM confirmed 128 MiB
  peak_flops: 918.0e12
  peak_hbm_bw: 1759.0e9
  hbm_capacity_gb: 32.0
  vmem_capacity_mib: 128.0

batch:
  variants_per_round: 4
  top_k: 2
  max_active_lineages: 3

session:
  max_iterations: 6
  output_dir: "runs/matmul_pallas"
  # This repo is private and self-contained: tracking (Issue/PR/comments) and
  # AGENT.md default to this repo — no separate tracking repo needed.
